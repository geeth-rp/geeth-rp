<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Geeth Rangika Pelpola — Business Analyst, UI/UX Designer and Builder">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <clipPath id="panelClip"><rect x="10" y="10" width="1180" height="450" rx="22"/></clipPath>
    <clipPath id="storyClip">
      <rect x="718" y="344" width="0" height="50">
        <animate attributeName="width" values="0;250;250;0" keyTimes="0;0.35;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace; }

    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

    .frame { stroke-dasharray: 1240; stroke-dashoffset: 1240; animation: draw 1.4s .3s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .handle { opacity: 0; animation: pop .3s forwards; transform-box: fill-box; transform-origin: center; }
    .h1 { animation-delay: 1.5s; } .h2 { animation-delay: 1.6s; } .h3 { animation-delay: 1.7s; } .h4 { animation-delay: 1.8s; }
    .dim { opacity: 0; animation: fade .5s 1.9s forwards; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.4); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fade { to { opacity: 1; } }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .r1 { animation-delay: .1s; } .r2 { animation-delay: .25s; } .r3 { animation-delay: .4s; }
    .r4 { animation-delay: .9s; } .r5 { animation-delay: 1.1s; } .r6 { animation-delay: 1.3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .cursor { animation: cursor 9s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes cursor {
      0%   { transform: translate(1080px, 440px); opacity: 0; }
      8%   { opacity: 1; }
      22%  { transform: translate(538px, 302px); }
      30%  { transform: translate(538px, 302px); }
      40%  { transform: translate(560px, 318px); }
      48%  { transform: translate(538px, 302px); }
      62%  { transform: translate(538px, 302px); }
      80%  { transform: translate(760px, 360px); opacity: 1; }
      92%  { transform: translate(1080px, 440px); opacity: 0; }
      100% { transform: translate(1080px, 440px); opacity: 0; }
    }



    .orb { animation: orb 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes orb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 6s 1.5s ease-in-out infinite; }
    .float3 { animation: float 6s 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  </style>

  <!-- panel -->
  <rect x="10" y="10" width="1180" height="450" rx="22" fill="#0a0a0c"/>
  <g clip-path="url(#panelClip)">
    <rect x="10" y="10" width="1180" height="450" fill="url(#dots)"/>
    <circle cx="300" cy="240" r="320" fill="url(#glowA)"/>
    <circle cx="960" cy="260" r="300" fill="url(#glowB)"/>
  </g>
  <rect x="10.5" y="10.5" width="1179" height="449" rx="22" fill="none" stroke="#1f1f24"/>

  <!-- top bar -->
  <circle class="pulse" cx="48" cy="48" r="4" fill="#34d399"/>
  <text class="mono" x="62" y="52" font-size="12" fill="#a1a1aa" letter-spacing="1.5">GEETH-RP / README.FIG</text>
  <text class="mono" x="1152" y="52" font-size="12" fill="#71717a" letter-spacing="1.5" text-anchor="end">MATALE, LK · UTC+05:30 · OPEN TO BA &amp; PRODUCT ROLES</text>
  <line x1="40" y1="74" x2="1160" y2="74" stroke="#1f1f24"/>

  <!-- left: identity -->
  <text class="mono rise r1" x="58" y="140" font-size="13" fill="#34d399" letter-spacing="4">// BUSINESS ANALYST · UI/UX · BUILDER</text>

  <g class="rise r2">
    <text class="sans" x="72" y="220" font-size="58" font-weight="800" fill="#fafafa" letter-spacing="-1.5">Geeth Rangika</text>
    <text class="sans" x="72" y="280" font-size="58" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.5">Pelpola</text>
  </g>

  <!-- figma-style selection frame -->
  <rect class="frame" x="56" y="164" width="482" height="130" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <rect class="handle h1" x="52" y="160" width="8" height="8" fill="#0a0a0c" stroke="#38bdf8" stroke-width="1.5"/>
  <rect class="handle h2" x="534" y="160" width="8" height="8" fill="#0a0a0c" stroke="#38bdf8" stroke-width="1.5"/>
  <rect class="handle h3" x="52" y="290" width="8" height="8" fill="#0a0a0c" stroke="#38bdf8" stroke-width="1.5"/>
  <rect class="handle h4" x="534" y="290" width="8" height="8" fill="#0a0a0c" stroke="#38bdf8" stroke-width="1.5"/>
  <g class="dim">
    <rect x="257" y="304" width="80" height="20" rx="4" fill="#38bdf8"/>
    <text class="mono" x="297" y="318" font-size="11" font-weight="700" fill="#0a0a0c" text-anchor="middle">482 × 130</text>
  </g>

  <text class="sans rise r4" x="58" y="362" font-size="18" fill="#a1a1aa">I turn messy requirements into clear, shippable products.</text>

  <g class="rise r5">
    <rect x="58" y="384" width="176" height="30" rx="15" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.35"/>
    <text class="mono" x="146" y="404" font-size="12" fill="#6ee7b7" text-anchor="middle">IEEE CS · Vice-Chair</text>
    <rect x="244" y="384" width="176" height="30" rx="15" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text class="mono" x="332" y="404" font-size="12" fill="#7dd3fc" text-anchor="middle">Founder · Pixlore AI</text>
    <rect x="430" y="384" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#3f3f46"/>
    <text class="mono" x="510" y="404" font-size="12" fill="#d4d4d8" text-anchor="middle">BSc SE · SLTC '27</text>
  </g>

  <!-- right: canvas composition -->
  <!-- card A: analyst owl -->
  <style>
    .owl { transform-box: fill-box; transform-origin: 50% 100%; animation: tilt 6s ease-in-out infinite; }
    @keyframes tilt { 0%,20%,100% { transform: rotate(0deg); } 28%,42% { transform: rotate(-7deg); } 52%,66% { transform: rotate(6deg); } 74% { transform: rotate(0deg); } }
    .pupil { animation: look 6s ease-in-out infinite; }
    @keyframes look { 0%,20%,100% { transform: translate(0,0); } 28%,42% { transform: translate(-4px,-1px); } 52%,66% { transform: translate(4px,1px); } 74% { transform: translate(0,0); } }
    .lid { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); animation: blink 4s infinite; }
    @keyframes blink { 0%,90%,100% { transform: scaleY(0); } 94% { transform: scaleY(1); } }
    .wing { transform-box: fill-box; transform-origin: 50% 10%; animation: wave 9s ease-in-out infinite; }
    @keyframes wave { 0%,62%,100% { transform: rotate(0deg); } 66% { transform: rotate(-38deg); } 70% { transform: rotate(-18deg); } 74% { transform: rotate(-38deg); } 78% { transform: rotate(0deg); } }
    .msg { opacity: 0; animation: msg 9s infinite; }
    .m1 { animation-delay: 0s; } .m2 { animation-delay: 3s; } .m3 { animation-delay: 6s; }
    @keyframes msg { 0% { opacity: 0; transform: translateY(4px); } 4%,30% { opacity: 1; transform: translateY(0); } 34%,100% { opacity: 0; transform: translateY(-4px); } }
    .twinkle { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    .leaf { transform-box: fill-box; transform-origin: 0% 50%; animation: sway 4s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
  </style>
  <g class="float1">
    <g class="rise r3">
      <rect x="700" y="102" width="450" height="190" rx="14" fill="#111114" stroke="#232329"/>
      <text class="mono" x="722" y="130" font-size="11" fill="#71717a" letter-spacing="1">◉ analyst-owl.fig</text>
      <circle cx="1112" cy="126" r="3" fill="#3f3f46"/><circle cx="1122" cy="126" r="3" fill="#3f3f46"/><circle cx="1132" cy="126" r="3" fill="#3f3f46"/>
      <line x1="700" y1="142" x2="1150" y2="142" stroke="#1d1d22"/>

      <!-- twinkles -->
      <circle class="twinkle" cx="740" cy="168" r="1.6" fill="#34d399"/>
      <circle class="twinkle" style="animation-delay:1s" cx="902" cy="160" r="1.4" fill="#38bdf8"/>
      <circle class="twinkle" style="animation-delay:2s" cx="760" cy="230" r="1.2" fill="#a78bfa"/>
      <circle class="twinkle" style="animation-delay:.5s" cx="1130" cy="250" r="1.4" fill="#34d399"/>

      <!-- branch -->
      <path d="M722 268 Q 820 260 920 266" fill="none" stroke="#3f3f46" stroke-width="5" stroke-linecap="round"/>
      <path class="leaf" d="M878 265 q 14 -12 26 -4 q -12 12 -26 4 Z" fill="#34d399" fill-opacity="0.7"/>
      <path class="leaf" style="animation-delay:1.3s" d="M736 268 q 12 10 24 4 q -10 -12 -24 -4 Z" fill="#34d399" fill-opacity="0.5"/>

      <!-- owl -->
      <g class="owl">
        <!-- tufts -->
        <path d="M790 184 L784 160 L804 176 Z" fill="#26262d"/>
        <path d="M850 184 L856 160 L836 176 Z" fill="#26262d"/>
        <!-- body -->
        <ellipse cx="820" cy="216" rx="40" ry="48" fill="#1f1f25" stroke="#2f2f37" stroke-width="1.5"/>
        <ellipse cx="820" cy="232" rx="24" ry="28" fill="#27272e"/>
        <path d="M810 226 l5 5 l5 -5 M820 226 l5 5 l5 -5 M813 240 l5 5 l5 -5 M823 240 l4 4 M808 240 l3 3 M815 253 l5 5 l5 -5" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
        <!-- wings -->
        <path d="M782 206 Q 772 232 786 254 Q 792 232 790 208 Z" fill="#18181d"/>
        <path class="wing" d="M858 206 Q 868 232 854 254 Q 848 232 850 208 Z" fill="#18181d"/>
        <!-- glasses + eyes -->
        <circle cx="804" cy="200" r="14" fill="#0a0a0c" stroke="#34d399" stroke-width="2"/>
        <circle cx="836" cy="200" r="14" fill="#0a0a0c" stroke="#34d399" stroke-width="2"/>
        <line x1="818" y1="199" x2="822" y2="199" stroke="#34d399" stroke-width="2"/>
        <g class="pupil">
          <circle cx="804" cy="200" r="5.5" fill="#fafafa"/>
          <circle cx="836" cy="200" r="5.5" fill="#fafafa"/>
          <circle cx="805.5" cy="198.5" r="1.6" fill="#0a0a0c"/>
          <circle cx="837.5" cy="198.5" r="1.6" fill="#0a0a0c"/>
        </g>
        <circle class="lid" cx="804" cy="200" r="13" fill="#1f1f25"/>
        <circle class="lid" cx="836" cy="200" r="13" fill="#1f1f25"/>
        <!-- beak -->
        <path d="M815 210 L825 210 L820 220 Z" fill="#fbbf24"/>
        <!-- feet -->
        <path d="M806 263 l-3 6 M810 263 l0 7 M814 263 l3 6 M826 263 l-3 6 M830 263 l0 7 M834 263 l3 6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- speech bubble -->
      <rect x="912" y="166" width="214" height="52" rx="12" fill="#16161b" stroke="#2a2a31"/>
      <path d="M914 196 L900 206 L918 204 Z" fill="#16161b" stroke="#2a2a31" stroke-linejoin="round"/>
      <rect x="913" y="194" width="8" height="12" fill="#16161b"/>
      <text class="sans msg m1" x="930" y="197" font-size="14" fill="#e4e4e7">Hoo's the stakeholder?</text>
      <text class="sans msg m2" x="930" y="197" font-size="14" fill="#e4e4e7">Asking "why?" × 5 …</text>
      <text class="sans msg m3" x="930" y="197" font-size="14" fill="#e4e4e7">Ship it? Hoo-ray!</text>

      <text class="mono" x="944" y="248" font-size="10" fill="#71717a">mood: curious</text>
      <text class="mono" x="944" y="264" font-size="10" fill="#71717a">coffee: <tspan fill="#34d399">■■■</tspan><tspan fill="#3f3f46">■■</tspan></text>
    </g>
  </g>

  <!-- card B: user story -->
  <g class="float2">
    <g class="rise r4">
      <rect x="700" y="312" width="272" height="112" rx="14" fill="#111114" stroke="#232329"/>
      <rect x="700" y="332" width="3" height="72" rx="1.5" fill="#34d399"/>
      <text class="mono" x="720" y="336" font-size="10" fill="#34d399" letter-spacing="1.5">USER STORY · CG-21</text>
      <g clip-path="url(#storyClip)">
        <text class="sans" x="720" y="362" font-size="14" fill="#e4e4e7">As a learner, I want guidance,</text>
        <text class="sans" x="720" y="384" font-size="14" fill="#e4e4e7">so that I think — not just copy.</text>
      </g>
      <text class="mono" x="720" y="410" font-size="10" fill="#71717a">✓ acceptance criteria 3/3</text>
    </g>
  </g>

  <!-- card C: gen-ai render -->
  <g class="float3">
    <g class="rise r5">
      <rect x="990" y="312" width="160" height="112" rx="14" fill="#111114" stroke="#232329"/>
      <text class="mono" x="1008" y="336" font-size="10" fill="#a78bfa" letter-spacing="1.5">GEN-AI</text>
      <circle class="orb" cx="1116" cy="352" r="16" fill="url(#orb)"/>
      <text class="sans" x="1008" y="380" font-size="14" font-weight="600" fill="#e4e4e7">Pixlore render</text>
      <rect x="1008" y="396" width="124" height="4" rx="2" fill="#232329"/>
      <rect x="1008" y="396" width="0" height="4" rx="2" fill="#a78bfa">
        <animate attributeName="width" values="0;124;124" keyTimes="0;0.8;1" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <text class="mono" x="1008" y="414" font-size="9" fill="#71717a">flux · comfyui</text>
    </g>
  </g>

  <!-- multiplayer cursor -->
  <g class="cursor">
    <path d="M0 0 L0 19 L5 14.5 L8.6 22 L11.4 20.8 L7.9 13.6 L14.5 13.6 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="14" y="20" width="54" height="20" rx="6" fill="#38bdf8"/>
    <text class="sans" x="41" y="34" font-size="11" font-weight="700" fill="#0a0a0c" text-anchor="middle">Geeth</text>
  </g>
</svg>
