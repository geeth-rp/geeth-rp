  <line x1="648.0" y1="136" x2="648.0" y2="360" stroke="#ffffff" stroke-opacity="0.05"/>
  <text class="mono" x="654.0" y="128" font-size="11" fill="#71717a">2025</text>
  <line x1="812.0" y1="136" x2="812.0" y2="360" stroke="#ffffff" stroke-opacity="0.05"/>
  <text class="mono" x="818.0" y="128" font-size="11" fill="#71717a">2026</text>
  <line x1="976.0" y1="136" x2="976.0" y2="360" stroke="#ffffff" stroke-opacity="0.05"/>
  <text class="mono" x="982.0" y="128" font-size="11" fill="#71717a">2027</text>
  <line x1="1140.0" y1="136" x2="1140.0" y2="360" stroke="#ffffff" stroke-opacity="0.05"/>
  <text class="sans" x="50" y="168" font-size="13" font-weight="600" fill="#e4e4e7">BSc (Hons) Software Engineering</text>
  <text class="mono" x="50" y="184" font-size="10" fill="#71717a">SLTC · 2023 – 2027</text>
  <line x1="320.0" y1="170" x2="1140.0" y2="170" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="2 4"/>
  <g class="grow" style="animation-delay:0.20s">
    <rect x="320.0" y="163" width="754.4" height="14" rx="7" fill="url(#gE)" fill-opacity="0.22"/>
    <rect x="320.0" y="163" width="621.8" height="14" rx="7" fill="url(#gE)"/>
    <rect x="941.8" y="163" width="132.6" height="14" rx="7" fill="url(#stripe)"/>
  </g>
  <text class="sans" x="50" y="213" font-size="13" font-weight="600" fill="#e4e4e7">Logistics Sub-Committee Head</text>
  <text class="mono" x="50" y="229" font-size="10" fill="#71717a">IEEE CS SBC · 2024 – 2025</text>
  <line x1="320.0" y1="215" x2="1140.0" y2="215" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="2 4"/>
  <rect class="grow" style="animation-delay:0.35s" x="582.4" y="208" width="164.0" height="14" rx="7" fill="url(#gS)"/>
  <text class="sans" x="50" y="258" font-size="13" font-weight="600" fill="#e4e4e7">Vice-Chairperson</text>
  <text class="mono" x="50" y="274" font-size="10" fill="#71717a">IEEE CS SBC · 2025 – 2026</text>
  <line x1="320.0" y1="260" x2="1140.0" y2="260" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="2 4"/>
  <rect class="grow" style="animation-delay:0.50s" x="746.4" y="253" width="164.0" height="14" rx="7" fill="url(#gS)"/>
  <text class="sans" x="50" y="303" font-size="13" font-weight="600" fill="#e4e4e7">Shipped projects</text>
  <text class="mono" x="50" y="319" font-size="10" fill="#71717a">milestones</text>
  <line x1="320.0" y1="305" x2="1140.0" y2="305" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="2 4"/>
  <rect class="pop" style="animation-delay:0.90s" x="717.2" y="299" width="12" height="12" rx="2" fill="#0a0a0c" stroke="#fbbf24" stroke-width="2"/>
  <rect class="pop" style="animation-delay:1.05s" x="908.5" y="299" width="12" height="12" rx="2" fill="#0a0a0c" stroke="#fbbf24" stroke-width="2"/>
  <rect class="pop" style="animation-delay:1.20s" x="908.5" y="299" width="12" height="12" rx="2" fill="#0a0a0c" stroke="#fbbf24" stroke-width="2"/>
  <rect class="pop" style="animation-delay:1.35s" x="922.2" y="299" width="12" height="12" rx="2" fill="#0a0a0c" stroke="#fbbf24" stroke-width="2"/>
  <text class="mono fade" style="animation-delay:1.2s" x="723.2" y="291" font-size="10" fill="#fcd34d" text-anchor="middle">Utopia</text>
  <text class="mono fade" style="animation-delay:1.5s" x="936.2" y="291" font-size="10" fill="#fcd34d" text-anchor="end">OGBN · Pixlore · SmartCare</text>
  <text class="sans" x="50" y="348" font-size="13" font-weight="600" fill="#e4e4e7">CogniGuide · Final Year Project</text>
  <text class="mono" x="50" y="364" font-size="10" fill="#71717a">ongoing · research + build</text>
  <line x1="320.0" y1="350" x2="1140.0" y2="350" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="2 4"/>
  <g class="grow" style="animation-delay:0.80s">
    <rect x="812.0" y="343" width="246.0" height="14" rx="7" fill="url(#gV)" fill-opacity="0.22"/>
    <rect x="812.0" y="343" width="129.8" height="14" rx="7" fill="url(#gV)"/>
    <rect x="941.8" y="343" width="116.2" height="14" rx="7" fill="url(#stripe)"/>
  </g>
  <line class="today" x1="941.8" y1="140" x2="941.8" y2="358" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="889.8" y="360" width="104" height="20" rx="10" fill="#34d399"/>
  <text class="mono" x="941.8" y="374" font-size="10" font-weight="700" fill="#0a0a0c" text-anchor="middle">TODAY · OCT 26</text>
</svg>
