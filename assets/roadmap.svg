<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Timeline: BSc at SLTC 2023-2027, IEEE CS roles, shipped projects and the ongoing final year project">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <clipPath id="panelClip"><rect x="10" y="10" width="1180" height="380" rx="22"/></clipPath>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#ffffff" fill-opacity="0"/>
      <rect width="5" height="12" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="gE" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="gS" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="gV" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .pop { opacity: 0; animation: pop .4s forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0) rotate(45deg); } 100% { opacity: 1; transform: scale(1) rotate(45deg); } }
    .fade { opacity: 0; animation: fade .6s forwards; }
    @keyframes fade { to { opacity: 1; } }
    .today { animation: today 2s ease-in-out infinite; }
    @keyframes today { 0%,100% { stroke-opacity: .9; } 50% { stroke-opacity: .3; } }
    .stripes { animation: slide 1s linear infinite; }
    @keyframes slide { to { transform: translateX(-12px); } }
  </style>
  <rect x="10" y="10" width="1180" height="380" rx="22" fill="#0a0a0c"/>
  <rect x="10" y="10" width="1180" height="380" fill="url(#grid)" clip-path="url(#panelClip)"/>
  <rect x="10.5" y="10.5" width="1179" height="379" rx="22" fill="none" stroke="#1f1f24"/>
  <text class="mono" x="50" y="58" font-size="12" fill="#38bdf8" letter-spacing="4">// 04 — TIMELINE</text>
  <text class="sans" x="50" y="96" font-size="30" font-weight="800" fill="#fafafa" letter-spacing="-.5">The roadmap so far</text>
  <rect x="968" y="42" width="182" height="28" rx="14" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.35"/>
  <circle class="pulse" cx="986" cy="56" r="3.5" fill="#38bdf8"/>
  <text class="mono" x="998" y="60" font-size="11" fill="#7dd3fc">status: in progress</text>
  <line x1="320.0" y1="136" x2="320.0" y2="360" stroke="#ffffff" stroke-opacity="0.05"/>
  <text class="mono" x="326.0" y="128" font-size="11" fill="#71717a">2023</text>
  <line x1="484.0" y1="136" x2="484.0" y2="360" stroke="#ffffff" stroke-opacity="0.05"/>
